name: CI

# Gate every PR (and pushes to master) on: backend deps resolve + compile +
# import smoke + the retrieval-quality eval, and frontend typecheck + build.
# Enable "Require status checks to pass before merging" in branch protection so
# a red run blocks the merge (INF-05).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: backend (deps · compile · import · eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extraction-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extraction-service/requirements.txt

      # Validates the pinned dependency set resolves (e.g. the httpx<0.28 pin
      # that keeps the OpenAI/Anthropic SDKs importable).
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile (syntax check)
        run: python -m compileall -q app

      # Import the app modules without any services — catches import-time errors.
      - name: Import smoke test
        run: |
          python -c "import app.config, app.chat, app.plans, app.billing, \
            app.pipeline, app.costs, app.embeddings, app.chapter_guide, \
            app.chunk_cache, app.export, app.api; print('imports OK')"

      # Retrieval-quality gate (pure Python, no DB/model) — fails on regression.
      - name: Retrieval eval
        run: python eval/retrieval_eval.py

      # JSON-extraction / sanitization unit tests (EFT-01/03/06), OCR quality
      # gate (OCRQ-01/02/03), and pgvector read-path grounding (OUT-04).
      # These are DB-free; the pgvector store integration test skips without a DB.
      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest tests/test_json_extract.py tests/test_ocr_quality.py tests/test_chat_semantic.py tests/test_embeddings_split.py tests/test_model_available.py -q

      # Extraction eval smoke (EFT-09): runs the full pipeline on a committed PDF
      # with a deterministic stub provider (no live model / DB / Redis needed) and
      # fails if quality thresholds regress (brief present, chunk success, concepts).
      - name: Extraction eval smoke
        run: python scripts/eval_extraction.py run --tag ci --stub --assert tests/eval/sample_backend.pdf

  frontend:
    name: frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
